services:
  # Traefik Reverse Proxy (interne)
  traefik:
    image: traefik:v3.0
    container_name: jadus-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./certs:/certs:ro
    networks:
      - jadus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "https://localhost/health || wget", "-q", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Base de donnÃ©es MongoDB (avec TLS)
  mongodb:
    image: mongo:7.0
    container_name: jadus-mongodb
    command:
      - mongod
      - --auth
      - --tlsMode=preferTLS
      - --tlsCertificateKeyFile=/etc/mongodb/mongodb-combined.pem
      - --tlsCAFile=/etc/mongodb/ca.pem
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongodb_password_change_me
      MONGO_INITDB_DATABASE: jadus_server_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./certs/mongodb-combined.pem:/etc/mongodb/mongodb-combined.pem:ro
      - ./certs/ca.pem:/etc/mongodb/ca.pem:ro
    networks:
      - jadus-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # API Jadus (worker distinct)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: jadus-api:latest
    container_name: jadus-api
    environment:
      DATABASE_MODE: mongodb
      MONGODB_URI: mongodb://root:mongodb_password_change_me@mongodb:27017/jadus_server_db?authSource=admin&tls=true&tlsCAFile=/etc/mongodb/ca.pem
      MONGODB_TLS_ENABLED: "true"
      MONGODB_TLS_CA_FILE: /etc/mongodb/ca.pem
      JADUS_SERVICE_NAME: JadusAPI
      JADUS_API_SERVICE_NAME: JadusAPI
      LOG_LEVEL: INFO
      ALLOWED_ORIGINS: "https://localhost,https://127.0.0.1"
      SECRET_KEY: your_secret_key_change_me
      # Clé de chiffrement des résultats d'audit (AES-256-GCM), lue depuis .env.
      # ⚠️ passphrase >= 32 caractères, À DÉFINIR dans .env, et À NE PLUS MODIFIER
      # ensuite (sinon les résultats déjà chiffrés deviennent illisibles).
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY doit etre defini dans .env (min 32 caracteres)}
      DEBUG: "false"
    ports:
      - "8001:8001"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./certs/ca.pem:/etc/mongodb/ca.pem:ro
    networks:
      - jadus-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=jadus_jadus-network"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.routers.api.rule=Host(`localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Panel Web Jadus (worker distinct)
  panel-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: jadus-panel-web:latest
    container_name: jadus-panel-web
    environment:
      DATABASE_MODE: mongodb
      MONGODB_URI: mongodb://root:mongodb_password_change_me@mongodb:27017/jadus_server_db?authSource=admin&tls=true&tlsCAFile=/etc/mongodb/ca.pem
      MONGODB_TLS_ENABLED: "true"
      MONGODB_TLS_CA_FILE: /etc/mongodb/ca.pem
      JADUS_SERVICE_NAME: JadusPanelWeb
      JADUS_WEB_SERVICE_NAME: JadusPanelWeb
      LOG_LEVEL: INFO
      ALLOWED_ORIGINS: "https://localhost,https://127.0.0.1"
      SECRET_KEY: your_secret_key_change_me
      DEBUG: "false"
    ports:
      - "8003:8003"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./certs/ca.pem:/etc/mongodb/ca.pem:ro
    networks:
      - jadus-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=jadus_jadus-network"
      - "traefik.http.routers.panel-web.priority=1"
      - "traefik.http.routers.panel-web.rule=Host(`localhost`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.panel-web.entrypoints=websecure"
      - "traefik.http.routers.panel-web.tls=true"
      - "traefik.http.services.panel-web.loadbalancer.server.port=8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  jadus-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

