services:
  # Traefik Reverse Proxy (interne)
  traefik:
    image: traefik:v3.0
    container_name: jadus-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - jadus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Base de données MongoDB (avec TLS)
  mongodb:
    image: mongo:7.0
    container_name: jadus-mongodb
    command:
      - mongod
      - --auth
      - --tlsMode=preferTLS
      - --tlsCertificateKeyFile=/etc/mongodb/mongodb-combined.pem
      - --tlsCAFile=/etc/mongodb/ca.pem
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongodb_password_change_me
      MONGO_INITDB_DATABASE: c2_server_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./certs/mongodb-combined.pem:/etc/mongodb/mongodb-combined.pem:ro
      - ./certs/ca.pem:/etc/mongodb/ca.pem:ro
    networks:
      - jadus-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Backend API FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jadus-backend
    environment:
      # Configuration de la base de données (TLS)
      DATABASE_MODE: mongodb
      MONGODB_URI: mongodb://root:mongodb_password_change_me@mongodb:27017/c2_server_db?authSource=admin&tls=true&tlsCAFile=/etc/mongodb/ca.pem
      MONGODB_TLS_ENABLED: "true"
      MONGODB_TLS_CA_FILE: /etc/mongodb/ca.pem
      
      # Configuration de l'API
      LOG_LEVEL: INFO
      
      # Configuration CORS (utiliser HTTPS maintenant)
      ALLOWED_ORIGINS: "https://localhost,https://127.0.0.1"
      
      # Autres configurations
      SECRET_KEY: your_secret_key_change_me
      # Clé de chiffrement des résultats d'audit (AES-256-GCM), lue depuis .env.
      # ⚠️ passphrase >= 32 caractères, À DÉFINIR dans .env, et À NE PLUS MODIFIER
      # ensuite (sinon les résultats déjà chiffrés deviennent illisibles).
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY doit etre defini dans .env (min 32 caracteres)}
      DEBUG: "false"
    # Pas de publication du port 8000 sur l'hote : le backend est joint en interne
    # via le reseau docker (nginx `/api` -> backend:8000 et les labels Traefik).
    # (Publier 8000 echoue sous Windows : plage 7981-8080 reservee par WinNAT/Hyper-V.)
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./certs/ca.pem:/etc/mongodb/ca.pem:ro
    networks:
      - jadus-network
    labels:
      # Configuration Traefik pour le backend
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend.middlewares=stripprefix"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Nginx (HTTPS)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: jadus-frontend
    depends_on:
      - backend
      - traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./certs/api.pem:/etc/nginx/certs/api.pem:ro
      - ./certs/api-key.pem:/etc/nginx/certs/api-key.pem:ro
    networks:
      - jadus-network
    labels:
      # Configuration Traefik pour le frontend
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  jadus-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
